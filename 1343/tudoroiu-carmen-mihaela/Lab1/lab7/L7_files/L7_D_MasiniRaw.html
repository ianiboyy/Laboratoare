<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Masini - abordare "bruta"</title>
    <script>
        function loadMjs(){
            document.getElementById("mjs").innerHTML = 
            "<ul>"+
            "<li>Tip:   Dacia</li>" +
            "<li>Model:   Logan</li>" +
            "<li>Culoare:   verde</li>" +
            "</ul>";
        }

        function afiseazaMls(){
            if(localStorage.tip && localStorage.model && localStorage.culoare){
                var tL = localStorage.tip;
                var mL = localStorage.model;
                var cL = localStorage.culoare;
                
                document.getElementById("mls").innerHTML = 
                "<ul>"+
                "<li>Tip: " + tL +"</li>" +
                "<li>Model: "  + mL +"</li>" +
                "<li>Culoare: "  + cL + "</li>" +
                "</ul>";
            } else {
                document.getElementById("mls").innerHTML = "<p>Nicio mașină salvată</p>";
            }
        }

        function salveazaMls(){
            var tL = document.getElementById("tipL").value;
            var mL = document.getElementById("modelL").value;
            var cL = document.getElementById("culoareL").value;

            localStorage.tip = tL;
            localStorage.model = mL;
            localStorage.culoare = cL;

            document.getElementById("mls").innerHTML = 
            "<ul>"+
            "<li>Tip: " + tL +"</li>" +
            "<li>Model: "  + mL +"</li>" +
            "<li>Culoare: "  + cL + "</li>" +
            "</ul>";

            return false;
        }

        function stergeMls(){
            localStorage.removeItem("tip");
            localStorage.removeItem("model");
            localStorage.removeItem("culoare");
            document.getElementById("mls").innerHTML = "<p>Nicio mașină salvată</p>";
        }

        function afiseazaMss(){
            if(sessionStorage.tip && sessionStorage.model && sessionStorage.culoare){
                var tS = sessionStorage.tip;
                var mS = sessionStorage.model;
                var cS = sessionStorage.culoare;
                
                document.getElementById("mss").innerHTML = 
                "<ul>"+
                "<li>Tip: " + tS +"</li>" +
                "<li>Model: "  + mS +"</li>" +
                "<li>Culoare: "  + cS + "</li>" +
                "</ul>";
            } else {
                document.getElementById("mss").innerHTML = "<p>Nicio mașină salvată</p>";
            }
        }

        function salveazaMss(){
            var tS = document.getElementById("tipS").value;
            var mS = document.getElementById("modelS").value;
            var cS = document.getElementById("culoareS").value;

            sessionStorage.tip = tS;
            sessionStorage.model = mS;
            sessionStorage.culoare = cS;

            document.getElementById("mss").innerHTML = 
            "<ul>"+
            "<li>Tip: " + tS +"</li>" +
            "<li>Model: "  + mS +"</li>" +
            "<li>Culoare: "  + cS + "</li>" +
            "</ul>";

            return false;
        }

        function stergeMss(){
            sessionStorage.removeItem("tip");
            sessionStorage.removeItem("model");
            sessionStorage.removeItem("culoare");
            document.getElementById("mss").innerHTML = "<p>Nicio mașină salvată</p>";
        }
    </script>
</head>
<body onload="afiseazaMls(); afiseazaMss();">

<div style="background-color:LimeGreen;color:white;font-size:200%" onclick="loadMjs()">
    <p>Masina JavaScript</p>
    <div id="mjs"></div>
</div>

<div style="background-color:ForestGreen;color:white;font-size:200%">
    <p>Masina Local Storage</p>
    <form onsubmit="return salveazaMls()">
        <label for="tipL">Tip</label> <input id="tipL" required>
        <label for="modelL">Model</label> <input id="modelL" required>
        <label for="culoareL">Culoare</label> <input id="culoareL" required>
        <button type="submit">Salvează</button>
        <button type="button" onclick="stergeMls()">Șterge</button>
    </form>
    <div id="mls"></div>
</div>

<div style="background-color:SeaGreen;color:white;font-size:200%">
    <p>Masina Session Storage</p>
    <form onsubmit="return salveazaMss()">
        <label for="tipS">Tip</label> <input id="tipS" required>
        <label for="modelS">Model</label> <input id="modelS" required>
        <label for="culoareS">Culoare</label> <input id="culoareS" required>
        <button type="submit">Salvează</button>
        <button type="button" onclick="stergeMss()">Șterge</button>
    </form>
    <div id="mss"></div>
</div>

</body>
</html>
