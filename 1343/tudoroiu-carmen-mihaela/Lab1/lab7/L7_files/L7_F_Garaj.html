<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Garaj - Tablou de obiecte</title>
    <script>
        function afiseazaGaraj(){
            var garaj = JSON.parse(localStorage.getItem("garaj")) || [];
            var tabelHtml = "<table border='1'><tr><th>Tip</th><th>Model</th><th>Culoare</th><th>An fabricație</th><th>Acțiune</th></tr>";
            
            for(var i = 0; i < garaj.length; i++){
                tabelHtml += "<tr>" +
                    "<td>" + garaj[i].tip + "</td>" +
                    "<td>" + garaj[i].model + "</td>" +
                    "<td>" + garaj[i].culoare + "</td>" +
                    "<td>" + garaj[i].anFab + "</td>" +
                    "<td><button onclick='stergeMasina(" + i + ")'>Șterge</button></td>" +
                    "</tr>";
            }
            tabelHtml += "</table>";
            
            document.getElementById("tabelGaraj").innerHTML = tabelHtml;
            document.getElementById("numarMasini").innerHTML = "Număr mașini în garaj: " + garaj.length;
        }

        function adaugaMasina(){
            var tip = document.getElementById("tip").value;
            var model = document.getElementById("model").value;
            var culoare = document.getElementById("culoare").value;
            var anFab = document.getElementById("anFab").value;

            var garaj = JSON.parse(localStorage.getItem("garaj")) || [];
            garaj.push({tip: tip, model: model, culoare: culoare, anFab: anFab});
            
            localStorage.setItem("garaj", JSON.stringify(garaj));
            afiseazaGaraj();

            document.getElementById("formGaraj").reset();
            return false;
        }

        function stergeMasina(index){
            var garaj = JSON.parse(localStorage.getItem("garaj")) || [];
            garaj.splice(index, 1);
            localStorage.setItem("garaj", JSON.stringify(garaj));
            afiseazaGaraj();
        }
    </script>
</head>
<body onload="afiseazaGaraj()">

<h1>Garaj - Local Storage (Tablou de obiecte)</h1>

<form id="formGaraj" onsubmit="return adaugaMasina()">
    <label for="tip">Tip</label> <input id="tip" required>
    <label for="model">Model</label> <input id="model" required>
    <label for="culoare">Culoare</label> <input id="culoare" required>
    <label for="anFab">An fabricație</label> <input id="anFab" type="number" required>
    <button type="submit">Adaugă mașină</button>
</form>

<p id="numarMasini"></p>
<div id="tabelGaraj"></div>

</body>
</html>
