<!DOCTYPE html>
<html>
<head>
<title>
Acest titlu va fi modificat cu JS
</title>
</head>
<body>

<p>Salut <br /> lume! <br /> (De modificat culoarea de background cu js!)</p>

<p>Am folosit <b>getElementsByTagName</b> pentru a modifica culorile indicate in paragrafele alaturate <br /> si titlul paginii</p>

<p>Acest text va fi colorat <br/>folosind <br /> JavaScript</p>

<script>
var p = document.getElementsByTagName("p");

p[0].style.backgroundColor = "yellow";
p[0].style.color = "blue";

p[p.length - 1].style.backgroundColor = "blue";
p[p.length - 1].style.color = "yellow";

document.title = "Titlu modificat cu JavaScript";
</script>

</body>
</html>
