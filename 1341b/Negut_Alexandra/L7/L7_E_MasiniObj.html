<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Masini - abordare cu folosirea de obiecte</title>
    <script>
        window.onload = function() {
            afiseaza(localStorage, "mls", "masina");
            afiseaza(sessionStorage, "mss", "masinaSession");
        };

        function loadMjs(){
            var mJS = { tip: "bmw", model: "x5", culoare: "alb", anFab: 2021 };
            document.getElementById("mjs").innerHTML = 
            "<ul>"+
            "<li>Tip: " + mJS.tip +"</li>" +
            "<li>Model: " + mJS.model +"</li>" +
            "<li>Culoare: " + mJS.culoare + "</li>" +
            "<li>An fabricatie: " + mJS.anFab + "</li>" +
            "</ul>";
        }

        function afiseaza(depozit, elementId, cheie) {
            var dateSalvate = depozit.getItem(cheie);
            var container = document.getElementById(elementId);
            
            if (dateSalvate) {
                var masina = JSON.parse(dateSalvate);
                container.innerHTML = 
                "<ul>"+
                "<li>Tip: " + masina.tip + "</li>" +
                "<li>Model: " + masina.model + "</li>" +
                "<li>Culoare: " + masina.culoare + "</li>" +
                "<li>An fabricatie: " + masina.anFab + "</li>" +
                "</ul>";
            } else {
                container.innerHTML = "<p>Nicio mașină salvată</p>";
            }
        }

        function salveazaMasinaLocal(event) {
            if (event) event.preventDefault();

            var masinaL = {
                tip: document.getElementById("tipL").value,
                model: document.getElementById("modelL").value,
                culoare: document.getElementById("culoareL").value,
                anFab: document.getElementById("anFabL").value
            };

            localStorage.setItem("masina", JSON.stringify(masinaL));
            
            afiseaza(localStorage, "mls", "masina");
            return false;
        }

        function stergeMasinaLocal() {
            localStorage.removeItem("masina");
            afiseaza(localStorage, "mls", "masina");
        }

        function loadMss(event) {
            if (event) event.preventDefault();

            var masinaS = {
                tip: document.getElementById("tipS").value,
                model: document.getElementById("modelS").value,
                culoare: document.getElementById("culoareS").value,
                anFab: document.getElementById("anFabS").value
            };

            sessionStorage.setItem("masinaSession", JSON.stringify(masinaS));

            afiseaza(sessionStorage, "mss", "masinaSession");
            return false;
        }

        function stergeMasinaSession() {
            sessionStorage.removeItem("masinaSession");
            afiseaza(sessionStorage, "mss", "masinaSession");
        }
    </script>
</head>
<body>


    <div style="background-color:LimeGreen;color:white;font-size:150%;padding:10px;margin-bottom:15px;" onclick="loadMjs()">
        <p>Masina JavaScript</p>
        <div id="mjs"></div>
    </div>


    <div style="background-color:ForestGreen;color:white;font-size:150%;padding:10px;margin-bottom:15px;">
        <p>Masina Local Storage</p>
        <form onsubmit="return salveazaMasinaLocal(event);">
            <label for="tipL">Tip:</label><br>
            <input type="text" id="tipL" required><br>
            <label for="modelL">Model:</label><br>
            <input type="text" id="modelL" required><br>
            <label for="culoareL">Culoare:</label><br>
            <input type="text" id="culoareL" required><br>
            <label for="anFabL">An fabricație:</label><br>
            <input type="number" id="anFabL" required><br><br>
            <input type="submit" value="Salvează">
            <input type="button" value="Șterge" onclick="stergeMasinaLocal()">
        </form>
        <div id="mls"></div>
    </div>

   
    <div style="background-color:SeaGreen;color:white;font-size:150%;padding:10px;margin-bottom:15px;">
        <p>Masina Session Storage</p>
        <form onsubmit="return loadMss(event);">
            <label for="tipS">Tip:</label><br>
            <input type="text" id="tipS" required><br>
            <label for="modelS">Model:</label><br>
            <input type="text" id="modelS" required><br>
            <label for="culoareS">Culoare:</label><br>
            <input type="text" id="culoareS" required><br>
            <label for="anFabS">An fabricație:</label><br>
            <input type="number" id="anFabS" required><br><br>
            <input type="submit" value="Salvează">
            <input type="button" value="Șterge" onclick="stergeMasinaSession()">
        </form>
        <div id="mss"></div>
    </div>

</body>
</html>
