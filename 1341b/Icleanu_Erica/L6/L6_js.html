<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Document creat cu JavaScript</title>
</head>
<body>
    <script>
        // 1. Crearea titlului mare și albastru
        const titlu = document.createElement("h1");
        titlu.textContent = "Acesta este titlul paginii";
        titlu.style.color = "blue";
        
        // 2. Crearea paragrafului pe trei linii, cu fundal galben
        const paragraf = document.createElement("p");
        // Folosim tag-ul <br> pentru a forța textul să se afișeze pe trei linii
        paragraf.innerHTML = "Aceasta este prima linie a paragrafului.<br>" +
                             "Aceasta este a doua linie a paragrafului.<br>" +
                             "Aceasta este a treia linie a paragrafului.";
        paragraf.style.backgroundColor = "yellow";

        // 3. Adăugarea elementelor create în interiorul tagului <body>
        document.body.appendChild(titlu);
        document.body.appendChild(paragraf);
    </script>
</body>
</html>
