<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Exercițiul L6_C</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }
        h1 {
            cursor: pointer;
            transition: color 0.3s;
        }
        p {
            cursor: pointer;
            padding: 10px;
            transition: background-color 0.3s;
        }
    </style>
</head>
<body>

    <h1 id="titlu">Titlul Această Pagină Web</h1>
    
    <p id="paragraf">
        Aceasta este prima linie de text din paragraf.<br>
        Aceasta este a doua linie a paragrafului.<br>
        Aceasta este a treia linie de text.
    </p>

    <script>
      
        const titlu = document.getElementById('titlu');
        titlu.addEventListener('click', function() {
            let culoare = prompt("Introduceți o culoare pentru titlu (ex: red, blue, #ff0000):");
            if (culoare !== null && culoare.trim() !== "") {
                if (CSS.supports("color", culoare)) {
                    titlu.style.color = culoare;
                } else {
                    alert("Culoare invalidă!");
                }
            }
        });

        
        const paragraf = document.getElementById('paragraf');
        paragraf.addEventListener('click', function() {
            let culoare = prompt("Introduceți o culoare de fundal pentru paragraf:");
            if (culoare !== null && culoare.trim() !== "") {
                if (CSS.supports("color", culoare)) {
                    paragraf.style.backgroundColor = culoare;
                } else {
                    alert("Culoare invalidă!");
                }
            }
        });
    </script>

</body>
</html>
