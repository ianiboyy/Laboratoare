<!DOCTYPE html>
<html>
<head>
<title>
Acest titlu va fi modificat cu JS
</title>
</head>
<body>

<p>Salutare, <br /> oameni buni! <br /> (De modificat culoarea de background cu js!)</p>

<p>Folositi metoda <b>getElementsByTagName</b> pentru a modifica culorile indicate in paragrafele alaturate, <br /> precum si titlul paginii !</p>

<p>Acest text va fi colorat <br/>folosind <br /> JavaScript</p>

<script>
// 1. Modificarea titlului paginii
document.title = "Titlu Nou Modificat cu JavaScript";

// 2. Selectarea tuturor elementelor de tip paragraf
var paragrafe = document.getElementsByTagName("p");

// 3. Modificarea culorii de fundal (background) pentru primul paragraf
paragrafe[0].style.backgroundColor = "lightyellow";

// 4. Modificarea culorii textului pentru ultimul paragraf
paragrafe[paragrafe.length - 1].style.color = "darkgreen";
</script>

</body>
</html>
