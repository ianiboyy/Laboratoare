<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>L6_B</title>
</head>
<body>
<button id="buton">Schimbă paragrafele</button>

<p id="p1" style="color: blue; font-size: 20px;">Primul paragraf.</p>
<p id="p2" style="color: darkred; font-style: italic;">Al doilea paragraf.</p>

<script>
var p1 = document.getElementById("p1");
var p2 = document.getElementById("p2");

function schimbaText() {
    var text = prompt("Introduceți noul text:", this.innerHTML);
    if (text !== null) {
        this.innerHTML = text;
    }
}

p1.onclick = schimbaText;
p2.onclick = schimbaText;

document.getElementById("buton").onclick = function () {
    var aux = p1.innerHTML;
    p1.innerHTML = p2.innerHTML;
    p2.innerHTML = aux;
};
</script>
</body>
</html>
