<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>L6_D - Galerie</title>
</head>
<body>
<h1>Galerie</h1>

<img id="imagine" src="Img/pisici.jpg" alt="Imagine din galerie" width="320" height="240">
<p id="pozitie">Imaginea 1 din 4</p>

<button id="inapoi">Înapoi</button>
<button id="inainte">Înainte</button>

<script>
var imagini = ["Img/pisici.jpg", "Img/caini.jpg", "Img/munti.jpg", "Img/mare.jpg"];
var curent = 0;

function afiseaza() {
    document.getElementById("imagine").src = imagini[curent];
    document.getElementById("pozitie").innerHTML = "Imaginea " + (curent + 1) + " din " + imagini.length;
}

document.getElementById("inainte").onclick = function () {
    curent = (curent + 1) % imagini.length;
    afiseaza();
};

document.getElementById("inapoi").onclick = function () {
    curent = (curent - 1 + imagini.length) % imagini.length;
    afiseaza();
};

afiseaza();
</script>
</body>
</html>
