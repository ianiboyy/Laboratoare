<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<title>
Acest titlu va fi modificat cu JS
</title>
</head>
<body>

<p>Salutare, <br /> oameni buni! <br /> (De modificat culoarea de background cu js!)</p>

<p>Folositi metoda <b>getElementsByTagName</b> pentru a modifica culorile indicate in paragrafele alaturate, <br /> precum si titlul paginii !</p>

<p>Acest text va fi colorat <br/>folosind <br /> JavaScript</p>

<script>
    // 1. Modificarea titlului paginii
    document.title = "Titlu Nou Setat prin JavaScript";

    // 2. Selectarea tuturor paragrafelor folosind getElementsByTagName
    const paragrafe = document.getElementsByTagName('p');

    // Verificăm că există paragrafe înainte de a le modifica
    if (paragrafe.length > 0) {
        // Modificăm culoarea de fundal a primului paragraf
        paragrafe[0].style.backgroundColor = "#ffeb3b"; // Galben deschis
        paragrafe[0].style.padding = "10px";

        // Modificăm culoarea textului (sau fundalul) ultimului paragraf
        let ultimulIndex = paragrafe.length - 1;
        paragrafe[ultimulIndex].style.color = "#d32f2f"; // Roșu închis
        paragrafe[ultimulIndex].style.fontWeight = "bold";
    }
</script>

</body>
</html>
