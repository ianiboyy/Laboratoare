<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Masini - Local Storage & Session Storage</title>
    <script>
       
        function loadMjs(){
            document.getElementById("mjs").innerHTML = 
            "<ul>"+
            "<li>Tip: Dacia</li>" +
            "<li>Model: Logan</li>" +
            "<li>Culoare: verde</li>" +
            "</ul>";
        }

     
        function init() {
            afiseazaMasinaL();
            afiseazaMasinaS();
        }

      
        function afiseazaMasinaL() {
            var mlsDiv = document.getElementById("mls");
            if (localStorage.getItem("tip") && localStorage.getItem("model") && localStorage.getItem("culoare")) {
                mlsDiv.innerHTML = 
                    "<ul>" +
                    "<li>Tip: " + localStorage.getItem("tip") + "</li>" +
                    "<li>Model: " + localStorage.getItem("model") + "</li>" +
                    "<li>Culoare: " + localStorage.getItem("culoare") + "</li>" +
                    "</ul>";
            } else {
                mlsDiv.innerHTML = "<p>Nicio mașină salvată</p>";
            }
        }

        function salveazaMls() {
            localStorage.setItem("tip", document.getElementById("tipL").value);
            localStorage.setItem("model", document.getElementById("modelL").value);
            localStorage.setItem("culoare", document.getElementById("culoareL").value);
            afiseazaMasinaL();
            return false;
        }

        function stergeMls() {
            localStorage.removeItem("tip");
            localStorage.removeItem("model");
            localStorage.removeItem("culoare");
            document.getElementById("formL").reset();
            afiseazaMasinaL();
        }

     
        function afiseazaMasinaS() {
            var mssDiv = document.getElementById("mss");
            if (sessionStorage.getItem("tipS") && sessionStorage.getItem("modelS") && sessionStorage.getItem("culoareS")) {
                mssDiv.innerHTML = 
                    "<ul>" +
                    "<li>Tip: " + sessionStorage.getItem("tipS") + "</li>" +
                    "<li>Model: " + sessionStorage.getItem("modelS") + "</li>" +
                    "<li>Culoare: " + sessionStorage.getItem("culoareS") + "</li>" +
                    "</ul>";
            } else {
                mssDiv.innerHTML = "<p>Nicio mașină salvată</p>";
            }
        }

        function salveazaMss() {
            sessionStorage.setItem("tipS", document.getElementById("tipS").value);
            sessionStorage.setItem("modelS", document.getElementById("modelS").value);
            sessionStorage.setItem("culoareS", document.getElementById("culoareS").value);
            afiseazaMasinaS();
            return false;
        }

        function stergeMss() {
            sessionStorage.removeItem("tipS");
            sessionStorage.removeItem("modelS");
            sessionStorage.removeItem("culoareS");
            document.getElementById("formS").reset();
            afiseazaMasinaS();
        }
    </script>
</head>
<body onload="init()">

   
    <div style="background-color:LimeGreen;color:white;font-size:150%;padding: 20px; margin-bottom: 10px;" onclick="loadMjs()">
        <p>Masina JavaScript</p>
        <div id="mjs"></div>
    </div>

    
    <div style="background-color:ForestGreen;color:white;font-size:150%;padding: 20px; margin-bottom: 10px;">
        <p>Masina Local Storage</p>
        <form id="formL" onsubmit="return salveazaMls()">
            <div>
                <label for="tipL">Tip</label> <input id="tipL" required>
            </div>
            <div style="margin-top: 5px;">
                <label for="modelL">Model</label> <input id="modelL" required>
            </div>
            <div style="margin-top: 5px;">
                <label for="culoareL">Culoare</label> <input id="culoareL" required>
            </div>
            <div style="margin-top: 10px;">
                <button type="submit">Salvează</button>
                <button type="button" onclick="stergeMls()">Șterge</button>
            </div>
        </form>
        <div id="mls"></div>
    </div>

    <div style="background-color:SeaGreen;color:white;font-size:150%;padding: 20px;">
        <p>Masina Session Storage</p>
        <form id="formS" onsubmit="return salveazaMss()">
            <div>
                <label for="tipS">Tip</label> <input id="tipS" required>
            </div>
            <div style="margin-top: 5px;">
                <label for="modelS">Model</label> <input id="modelS" required>
            </div>
            <div style="margin-top: 5px;">
                <label for="culoareS">Culoare</label> <input id="culoareS" required>
            </div>
            <div style="margin-top: 10px;">
                <button type="submit">Salvează</button>
                <button type="button" onclick="stergeMss()">Șterge</button>
            </div>
        </form>
        <div id="mss"></div>
    </div>
