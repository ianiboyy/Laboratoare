<!DOCTYPE html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <title>Masini - abordare "bruta"</title>
    <script>
      // "masina" JS (ramane neschimba)
      function loadMjs(){
          document.getElementById("mjs").innerHTML =
          "<ul>"+
          "<li>Tip:  Dacia</li>" +
          "<li>Model:  Logan</li>" +
          "<li>Culoare:  verde</li>" +
          "</ul>";
      }

      // --- LOCAL STORAGE ---
      function afiseazaMls() {
          if (localStorage.tipL && localStorage.modelL && localStorage.culoareL) {
              document.getElementById("mls").innerHTML =
              "<ul>"+
              "<li>Tip: " + localStorage.tipL + "</li>" +
              "<li>Model: " + localStorage.modelL + "</li>" +
              "<li>Culoare: " + localStorage.culoareL + "</li>" +
              "</ul>";
          } else {
              document.getElementById("mls").innerHTML = "<p>Nicio mașină salvată.</p>";[cite: 8]
          }
      }

      function salveazaMls() {
          localStorage.tipL = document.getElementById("tipL").value;
          localStorage.modelL = document.getElementById("modelL").value;
          localStorage.culoareL = document.getElementById("culoareL").value;

          afiseazaMls();
          return false;
      }

      function stergeMls() {
          localStorage.removeItem("tipL");
          localStorage.removeItem("modelL");
          localStorage.removeItem("culoareL");

          // Curățăm și câmpurile din formular
          document.getElementById("tipL").value = "";
          document.getElementById("modelL").value = "";
          document.getElementById("culoareL").value = "";

          afiseazaMls();
      }

      // --- SESSION STORAGE ---
      function afiseazaMss() {
          if (sessionStorage.tipS && sessionStorage.modelS && sessionStorage.culoareS) {
              document.getElementById("mss").innerHTML =
              "<ul>"+
              "<li>Tip: " + sessionStorage.tipS + "</li>" +
              "<li>Model: " + sessionStorage.modelS + "</li>" +
              "<li>Culoare: " + sessionStorage.culoareS + "</li>" +
              "</ul>";
          } else {
              document.getElementById("mss").innerHTML = "<p>Nicio mașină salvată.</p>";[cite: 8]
          }
      }

      function salveazaMss() {
          sessionStorage.tipS = document.getElementById("tipS").value;
          sessionStorage.modelS = document.getElementById("modelS").value;
          sessionStorage.culoareS = document.getElementById("culoareS").value;

          afiseazaMss();
          return false;
      }

      function stergeMss() {
          sessionStorage.removeItem("tipS");
          sessionStorage.removeItem("modelS");
          sessionStorage.removeItem("culoareS");

          document.getElementById("tipS").value = "";
          document.getElementById("modelS").value = "";
          document.getElementById("culoareS").value = "";

          afiseazaMss();
      }

      // Funcție apelată la deschiderea paginii
      function incarcaTot() {
          afiseazaMls();
          afiseazaMss();
      }
    </script>
  </head>
  <body onload="incarcaTot()">
    <!-- Masina JS -->
    <div
      style="background-color: LimeGreen; color: white; font-size: 200%"
      onclick="loadMjs()"
    >
      <p>Masina JavaScript</p>
      <div id="mjs"></div>
    </div>

    <!-- Masina Local Storage -->
    <div style="background-color: ForestGreen; color: white; font-size: 200%">
      <p>Masina Local Storage</p>
      <form onsubmit="return salveazaMls()">
        <label for="tipL">Tip</label> <input id="tipL" required />
        <label for="modelL">Model</label> <input id="modelL" required />
        <label for="culoareL">Culoare</label> <input id="culoareL" required />
        <button type="submit">Salvează</button>
        <button type="button" onclick="stergeMls()">Șterge</button>
      </form>
      <div id="mls"></div>
    </div>

    <!-- Masina Session Storage -->
    <div style="background-color: SeaGreen; color: white; font-size: 200%">
      <p>Masina Session Storage</p>
      <form onsubmit="return salveazaMss()">
        <label for="tipS">Tip</label> <input id="tipS" required />
        <label for="modelS">Model</label> <input id="modelS" required />
        <label for="culoareS">Culoare</label> <input id="culoareS" required />
        <button type="submit">Salvează</button>
        <button type="button" onclick="stergeMss()">Șterge</button>
      </form>
      <div id="mss"></div>
    </div>
  </body>
</html>
