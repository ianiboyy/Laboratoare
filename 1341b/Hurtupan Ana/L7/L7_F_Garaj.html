<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Garaj - Tablou de masini</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: rgb(255, 255, 255); }
        table { border-collapse: collapse; width: 100%; margin-top: 20px; background-color: rgb(247, 205, 205); }
        th, td { border: 1px solid black; padding: 8px; text-align: left; }
        th { background-color: rgb(9, 84, 153); color: rgb(255, 255, 255); }
        .container { max-width: 600px; margin: 0 auto; background-color: rgb(0, 85, 134); padding: 20px; color: white; border-radius: 10px;}
        button { cursor: pointer; }
    </style>
    <script>
        // Functie pentru a citi tabloul din Local Storage
        function getGaraj() {
            var garaj = localStorage.getItem("garaj");
            if (garaj) {
                return JSON.parse(garaj);
            } else {
                return []; // returnam un tablou gol daca cheia nu exista
            }
        }

        // Functie pentru a salva tabloul in Local Storage
        function setGaraj(garajArray) {
            localStorage.setItem("garaj", JSON.stringify(garajArray));
        }

        // Functie pentru a afisa tabelul si numarul de masini
        function afiseazaTabel() {
            var garaj = getGaraj();
            
            // Actualizam numarul de masini
            document.getElementById("numarMasini").innerHTML = "Numar de masini in garaj: " + garaj.length;
            
            // Construim tabelul
            var tabelHtml = "<table>";
            tabelHtml += "<tr><th>Tip</th><th>Model</th><th>Culoare</th><th>An</th><th>Actiune</th></tr>";
            
            for (var i = 0; i < garaj.length; i++) {
                tabelHtml += "<tr>";
                tabelHtml += "<td>" + garaj[i].tip + "</td>";
                tabelHtml += "<td>" + garaj[i].model + "</td>";
                tabelHtml += "<td>" + garaj[i].culoare + "</td>";
                tabelHtml += "<td>" + garaj[i].anFab + "</td>";
                tabelHtml += "<td><button type='button' onclick='stergeMasina(" + i + ")'>Sterge</button></td>";
                tabelHtml += "</tr>";
            }
            
            tabelHtml += "</table>";
            document.getElementById("tabelContainer").innerHTML = tabelHtml;
        }

        // Functie pentru adaugarea unei masini noi
        function adaugaMasina() {
            var t = document.getElementById("tip").value;
            var m = document.getElementById("model").value;
            var c = document.getElementById("culoare").value;
            var a = document.getElementById("an").value;
            
            var masinaNoua = { tip: t, model: m, culoare: c, anFab: a };
            
            var garaj = getGaraj();
            garaj.push(masinaNoua); // adaugam la finalul tabloului
            setGaraj(garaj); // salvam inapoi
            
            // Resetam formularul
            document.getElementById("formGaraj").reset();
            
            afiseazaTabel(); // refacem tabelul
            return false; // prevenim reincarcarea paginii
        }

        // Functie pentru stergerea unei masini dupa index
        function stergeMasina(index) {
            var garaj = getGaraj();
            garaj.splice(index, 1); // stergem 1 element de la pozitia 'index'
            setGaraj(garaj); // salvam tabloul modificat
            
            afiseazaTabel(); // refacem tabelul
        }
    </script>
</head>
<body onload="afiseazaTabel()">
    <div class="container">
        <h2>Adauga masina in Garaj</h2>
        <form id="formGaraj" onsubmit="return adaugaMasina()">
            <label for="tip">Tip:</label> <input id="tip" required> <br><br>
            <label for="model">Model:</label> <input id="model" required> <br><br>
            <label for="culoare">Culoare:</label> <input id="culoare" required> <br><br>
            <label for="an">An:</label> <input id="an" type="number" required> <br><br>
            <button type="submit">Adauga in garaj</button>
        </form>
        
        <h3 id="numarMasini"></h3>
    </div>

    <div id="tabelContainer"></div>
</body>
</html>
