<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Masini - abordare cu folosirea de obiecte</title>
    <script>
// "masina" JS
function loadMjs(){
    var mJS = {tip : "Dacia", model : "Logan", culoare : "verde", anFab : 2012};
    document.getElementById("mjs").innerHTML = 
    "<ul>"+
    "<li>Tip: " + mJS.tip +"</li>" +
    "<li>Model: "  + mJS.model +"</li>" +
    "<li>Culoare: "  + mJS.culoare + "</li>" +
    "<li>An fabricatie: "  + mJS.anFab + "</li>" +
    "</ul>";
}

// Functie generica pentru afisare (Ex. 6)
function afiseaza(depozit, idContainer) {
    if(depozit.getItem("masina")) {
        var masina = JSON.parse(depozit.getItem("masina"));
        document.getElementById(idContainer).innerHTML = 
        "<ul>"+
        "<li>Tip: " + masina.tip +"</li>" +
        "<li>Model: "  + masina.model +"</li>" +
        "<li>Culoare: "  + masina.culoare + "</li>" +
        "<li>An fabricatie: "  + masina.anFab + "</li>" +
        "</ul>";
    } else {
        document.getElementById(idContainer).innerHTML = "Nicio masina salvata";
    }
}

// Functie generica pentru stergere (Ex. 6)
function sterge(depozit, idContainer) {
    depozit.removeItem("masina");
    afiseaza(depozit, idContainer);
}

// Salvare "masina" LS (Ex. 5)
function salveazaMls(){
    var tL = document.getElementById("tipL").value;
    var mL = document.getElementById("modelL").value;
    var cL = document.getElementById("culoareL").value;
    var anL = document.getElementById("anL").value;
    
    var masinaL = {tip : tL, model : mL, culoare : cL, anFab : anL};
    localStorage.setItem("masina", JSON.stringify(masinaL));
    
    afiseaza(localStorage, "mls");
    return false; 
}

// Salvare "masina" SS (Ex. 6)
function salveazaMss(){
    var tS = document.getElementById("tipS").value;
    var mS = document.getElementById("modelS").value;
    var cS = document.getElementById("culoareS").value;
    var anS = document.getElementById("anS").value;
    
    var masinaS = {tip : tS, model : mS, culoare : cS, anFab : anS};
    sessionStorage.setItem("masina", JSON.stringify(masinaS));
    
    afiseaza(sessionStorage, "mss");
    return false; // previne reincarcarea paginii
}

// Afisare initiala la incarcarea paginii
function loadInitial() {
    afiseaza(localStorage, "mls");
    afiseaza(sessionStorage, "mss");
}
    </script>
</head>
<body onload="loadInitial()">
    <div style="background-color:LimeGreen;color:white;font-size:200%" onclick="loadMjs()">
        <p>Masina JavaScript</p>
        <div id="mjs"></div>
    </div>

    <div style="background-color:ForestGreen;color:white;font-size:200%">
        <p>Masina Local Storage</p>
        <form onsubmit="return salveazaMls()">
            <label for="tipL">Tip</label> <input id="tipL" required>
            <label for="modelL">Model</label> <input id="modelL" required>
            <label for="culoareL">Culoare</label> <input id="culoareL" required>
            <label for="anL">An</label> <input id="anL" type="number" required>
            <button type="submit">Salveaza</button>
            <button type="button" onclick="sterge(localStorage, 'mls')">Sterge</button>
        </form>
        <div id="mls"></div>
    </div>

    <div style="background-color:SeaGreen;color:white;font-size:200%">
        <p>Masina Session Storage</p>
        <form onsubmit="return salveazaMss()">
            <label for="tipS">Tip</label> <input id="tipS" required>
            <label for="modelS">Model</label> <input id="modelS" required>
            <label for="culoareS">Culoare</label> <input id="culoareS" required>
            <label for="anS">An</label> <input id="anS" type="number" required>
            <button type="submit">Salveaza</button>
            <button type="button" onclick="sterge(sessionStorage, 'mss')">Sterge</button>
        </form>
        <div id="mss"></div>
    </div>

</body>
</html>
