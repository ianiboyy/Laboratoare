<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Masini - abordare cu folosirea de obiecte</title>
    <script>
// "masina" JS
function loadMjs(){
var mJS = {tip : "Dacia", model : "Logan", culoare : "verde", anFab : 2012};
document.getElementById("mjs").innerHTML = 
"<ul>"+
"<li>Tip: " + mJS.tip +"</li>" +
"<li>Model: "  + mJS.model +"</li>" +
"<li>Culoare: "  + mJS.culoare + "</li>" +
"<li>An fabricatie: "  + mJS.anFab + "</li>" +
"</ul>";
}

// Functii generice de afisare si stergere (valabile pentru ambele depozite)
function afiseaza(depozit, divId) {
    var div = document.getElementById(divId);
    if (depozit.getItem("masina")) {
        var masinaObj = JSON.parse(depozit.getItem("masina"));
        div.innerHTML = 
        "<ul>" +
        "<li>Tip: " + masinaObj.tip + "</li>" +
        "<li>Model: " + masinaObj.model + "</li>" +
        "<li>Culoare: " + masinaObj.culoare + "</li>" +
        "<li>An fabricatie: " + masinaObj.anFab + "</li>" +
        "</ul>";
    } else {
        div.innerHTML = "<p>Nicio masina salvata</p>";
    }
}

function stergeMasina(depozit, divId) {
    depozit.removeItem("masina");
    afiseaza(depozit, divId);
}

// "masina" LS (Local Storage)
function salveazaMls() {
    var masinaL = {
        tip: document.getElementById("tipL").value,
        model: document.getElementById("modelL").value,
        culoare: document.getElementById("culoareL").value,
        anFab: document.getElementById("anL").value
    };
    
    localStorage.setItem("masina", JSON.stringify(masinaL));
    afiseaza(localStorage, "mls");
    
    return false;
}

// "masina" SS (Session Storage)
function salveazaMss() {
    var masinaS = {
        tip: document.getElementById("tipS").value,
        model: document.getElementById("modelS").value,
        culoare: document.getElementById("culoareS").value,
        anFab: document.getElementById("anS").value
    };
    
    sessionStorage.setItem("masina", JSON.stringify(masinaS));
    afiseaza(sessionStorage, "mss");
    
    return false;
}

function initializeaza() {
    afiseaza(localStorage, "mls");
    afiseaza(sessionStorage, "mss");
}
</script>
</head>
<body onload="initializeaza()">
<div style="background-color:LimeGreen;color:white;font-size:200%" onclick="loadMjs()">
<p>Masina JavaScript</p>
    <div id="mjs"></div>
    </div>

<div style="background-color:ForestGreen;color:white;font-size:200%">
    <p>Masina Local Storage</p>
    <form onsubmit="return salveazaMls()">
        <label for="tipL">Tip</label> <input id="tipL" required>
        <label for="modelL">Model</label> <input id="modelL" required>
        <label for="culoareL">Culoare</label> <input id="culoareL" required>
        <label for="anL">An fabricatie</label> <input type="number" id="anL" required>
        <button type="submit">Salveaza</button>
        <button type="button" onclick="stergeMasina(localStorage, 'mls')">Sterge</button>
    </form>
    <div id="mls"></div>
    </div>

<div style="background-color:SeaGreen;color:white;font-size:200%">
    <p>Masina Session Storage</p>
    <form onsubmit="return salveazaMss()">
        <label for="tipS">Tip</label> <input id="tipS" required>
        <label for="modelS">Model</label> <input id="modelS" required>
        <label for="culoareS">Culoare</label> <input id="culoareS" required>
        <label for="anS">An fabricatie</label> <input type="number" id="anS" required>
        <button type="submit">Salveaza</button>
        <button type="button" onclick="stergeMasina(sessionStorage, 'mss')">Sterge</button>
    </form>
    <div id="mss"></div>
    </div>

</body>
</html>
