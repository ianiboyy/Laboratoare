<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<title>Garaj masini</title>
<script>
function preiaGaraj() {
    var date = localStorage.getItem("garaj");
    if (date) {
        return JSON.parse(date);
    }
    return [];
}

function afiseazaGaraj() {
    var garaj = preiaGaraj();
    document.getElementById("nrMasini").innerHTML = "Numar masini in garaj: " + garaj.length;
    
    var container = document.getElementById("tabelGaraj");
    if (garaj.length === 0) {
        container.innerHTML = "<p>Garajul este gol.</p>";
        return;
    }

    var tabelHtml = "<table border='1'><tr><th>Tip</th><th>Model</th><th>Culoare</th><th>An fabricatie</th><th>Actiune</th></tr>";
    for (var i = 0; i < garaj.length; i++) {
        tabelHtml += "<tr>" +
            "<td>" + garaj[i].tip + "</td>" +
            "<td>" + garaj[i].model + "</td>" +
            "<td>" + garaj[i].culoare + "</td>" +
            "<td>" + garaj[i].anFab + "</td>" +
            "<td><button onclick='stergeMasina(" + i + ")'>Șterge</button></td>" +
            "</tr>";
    }
    tabelHtml += "</table>";
    container.innerHTML = tabelHtml;
}

function adaugaMasina() {
    var masinaNoua = {
        tip: document.getElementById("tip").value,
        model: document.getElementById("model").value,
        culoare: document.getElementById("culoare").value,
        anFab: document.getElementById("anFab").value
    };
    var garaj = preiaGaraj();
    garaj.push(masinaNoua);
    localStorage.setItem("garaj", JSON.stringify(garaj));
    
    document.getElementById("formGaraj").reset();
    afiseazaGaraj();
    return false;
}

function stergeMasina(index) {
    var garaj = preiaGaraj();
    garaj.splice(index, 1);
    localStorage.setItem("garaj", JSON.stringify(garaj));
    afiseazaGaraj();
}
</script>
</head>
<body onload="afiseazaGaraj()">

<h1>Garaj masini - Local Storage</h1>

<form id="formGaraj" onsubmit="return adaugaMasina()">
    <label for="tip">Tip:</label> <input id="tip" required>
    <label for="model">Model:</label> <input id="model" required>
    <label for="culoare">Culoare:</label> <input id="culoare" required>
    <label for="anFab">An fabricatie:</label> <input id="anFab" required>
    <button type="submit">Adaugă mașină</button>
</form>

<h3 id="nrMasini"></h3>
<div id="tabelGaraj"></div>

<br>
<a href="index.html">Inapoi la laboratorul 7</a>

</body>
</html>
