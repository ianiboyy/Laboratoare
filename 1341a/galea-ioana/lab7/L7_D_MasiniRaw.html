<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Masini - abordare "bruta"</title>
	<script>

// "masina" JS
function loadMjs(){
document.getElementById("mjs").innerHTML = 
"<ul>"+
"<li>Tip:  Dacia</li>" +
"<li>Model:  Logan</li>" +
"<li>Culoare:  verde</li>" +
"</ul>";
}

// "masina" LS
function afiseazaMls() {
        if (localStorage.tip && localStorage.model && localStorage.culoare) {
            document.getElementById("mls").innerHTML = 
            "<ul><li>Tip:" + localStorage.tip + "</li>" +
            "<li>Model:" + localStorage.model + "</li>" +
            "<li>Culoare:" + localStorage.culoare + "</li></ul>";
        } else {
                document.getElementById("mls").innerHTML = "<p>Nicio masina salvata</p>";
        }
}

function salveazaMls() {
        localStorage.tip = document.getElementById("tipL").value;
        localStorage.model = document.getElementById("modelL").value;
        localStorage.culoare = document.getElementById("culoareL").value;
            
        afiseazaMls(); 
        return false;  
}

function stergeMls() {
        localStorage.removeItem("tip");
        localStorage.removeItem("model");
        localStorage.removeItem("culoare");
            
        afiseazaMls(); 
}

// "masina" SS

function afiseazaMss() {
        if (sessionStorage.tipS && sessionStorage.modelS && sessionStorage.culoareS) {
            document.getElementById("mss").innerHTML = 
            "<ul><li>Tip: " + sessionStorage.tipS + "</li>" +
            "<li>Model: " + sessionStorage.modelS + "</li>" +
            "<li>Culoare: " + sessionStorage.culoareS + "</li></ul>";
        } else {
            document.getElementById("mss").innerHTML = "<p>Nicio mașină salvată</p>";
        }
}

function salveazaMss() {
        sessionStorage.tipS = document.getElementById("tipS").value;
        sessionStorage.modelS = document.getElementById("modelS").value;
        sessionStorage.culoareS = document.getElementById("culoareS").value;
            
        afiseazaMss();
        return false; 
}

function stergeMss() {
        sessionStorage.removeItem("tipS");
        sessionStorage.removeItem("modelS");
        sessionStorage.removeItem("culoareS");
            
        afiseazaMss();
}

function incarcaMasiniSalvate() {
            afiseazaMls();
            afiseazaMss();
        }

</script>
</head>
<body onload="incarcaMasiniSalvate()">
<div style="background-color:LimeGreen;color:white;font-size:200%" onclick="loadMjs()">
<p>Masina JavaScript</p>
	<div id="mjs"></div>
	</div>

<div style="background-color:ForestGreen;color:white;font-size:200%"> 
        <p>Masina Local Storage</p> 
        <form onsubmit="return salveazaMls()"> 
            <label for="tipL">Tip</label> <input id="tipL" required> 
            <label for="modelL">Model</label> <input id="modelL" required> 
            <label for="culoareL">Culoare</label> <input id="culoareL" required> 
            <button type="submit">Salvează</button> 
            <button type="button" onclick="stergeMls()">Șterge</button>
        </form> 
        <div id="mls"></div> 
    </div> 

<div style="background-color:SeaGreen;color:white;font-size:200%">
        <p>Masina Session Storage</p>
        <form onsubmit="return salveazaMss()"> 
            <label for="tipS">Tip</label> <input id="tipS" required> 
            <label for="modelS">Model</label> <input id="modelS" required> 
            <label for="culoareS">Culoare</label> <input id="culoareS" required> 
            <button type="submit">Salvează</button> 
            <button type="button" onclick="stergeMss()">Șterge</button>
        </form> 
        <div id="mss"></div>
    </div>
</body>
</html>
