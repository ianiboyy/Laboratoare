<!DOCTYPE html>
<html lang="ro">
<head>
	<meta charset="UTF-8">
	<title>Masini - abordare cu folosirea de obiecte"</title>
	<script>
		// "masina" JS
		function loadMjs(){
		var mJS = {tip : "Dacia", model : "Logan", culoare : "verde", anFab : 2012};
		document.getElementById("mjs").innerHTML =
		"<ul>"+
		"<li>Tip: " + mJS.tip +"</li>" +
		"<li>Model: "  + mJS.model +"</li>" +
		"<li>Culoare: "  + mJS.culoare + "</li>" +
		"<li>An fabricatie: "  + mJS.anFab + "</li>" +
		"</ul>";
		}

		// "masina" LS
		function loadMls(){
		if(localStorage.masina){
		var masinaL = JSON.parse(localStorage.masina)}
		else{
		var tL = prompt("Tip");
		var mL = prompt("Model");
		var cL = prompt("Culoare:");
		var masinaL = {tip : tL, model : mL, culoare : cL};
		localStorage.setItem("masina", JSON.stringify(masinaL));
		}
		}

		// functii de afisare si stergere a masinii in LS si SS

		function afisare_comuna(localStoragekey, id){
		document.getElementById(id).innerHTML =
		"<ul>"+
		"<li>Tip: " + JSON.parse(localStorage.getItem(localStoragekey)).tip +"</li>" +
		"<li>Model: "  + JSON.parse(localStorage.getItem(localStoragekey)).model +"</li>" +
		"<li>Culoare: "  + JSON.parse(localStorage.getItem(localStoragekey)).culoare + "</li>" +
		"<li>An fabricatie: "  + JSON.parse(localStorage.getItem(localStoragekey)).anFab + "</li>" +
		"</ul>";
		}

		function stergere_comuna(localStoragekey, id){
		localStorage.removeItem(localStoragekey);
		document.getElementById(id).innerHTML = "Masina stearsa!";
		}

	</script>
</head>
<body>
	<div style="background-color:LimeGreen;color:white;font-size:200%" onclick="loadMjs()">
		<p>Masina JavaScript</p>
		<div id="mjs"></div>
	</div>

	<div style="background-color:ForestGreen;color:white;font-size:200%" onclick="loadMls()">
		<p>Masina Local Storage</p>
		<form>
			<label for="tipL">Tip</label> <input id="tipL" required />
			<label for="modelL">Model</label> <input id="modelL" required />
			<label for="culoareL">Culoare</label> <input id="culoareL" required />
			<label for="an_de_fabricatieL">An de fabricatie</label> <input id="an_de_fabricatieL" required />
			
		</form>

		<div id="mls"></div>

	</div>

</body>
</html>
