	<script>
		   function salveazaMls() {
        let masina = {

        };

        localStorage.setItem("masina", JSON.stringify(masina));

// "masina" SS
function loadMss(){
if(sessionStorage.tip){
var tS = sessionStorage.tip;}
else{
var tS = prompt("Tip");
sessionStorage.tip = tS;
}
if(sessionStorage.model){
var mS = sessionStorage.model;}
else{
var mS = prompt("Model");
sessionStorage.model = mS;
}
if(sessionStorage.culoare){
var cS = sessionStorage.culoare;}
else{
var cS = prompt("Culoare:");
sessionStorage.culoare = cS;
}
document.getElementById("mss").innerHTML = 
"<ul>"+
"<li>Tip: " + tS +"</li>" +
"<li>Model: "  + mS +"</li>" +
"<li>Culoare: "  + cS + "</li>" +
"</ul>";
}

// ADAUGAT: salvare Masina Session Storage
function salveazaMss() {
    let masina = {
        tip: document.getElementById("tipS").value,
        model: document.getElementById("modelS").value,
        culoare: document.getElementById("culoareS").value
    };

    sessionStorage.setItem("masina", JSON.stringify(masina));
    afiseazaMss();

    return false;
}

// ADAUGAT: afisare Masina Session Storage
function afiseazaMss() {
    let date = sessionStorage.getItem("masina");
    let sectiune = document.getElementById("mss");

    if (date) {
        let masina = JSON.parse(date);

        sectiune.innerHTML =
            "<p>Masina salvata:</p>" +
            "<p>Tip: " + masina.tip + "</p>" +
            "<p>Model: " + masina.model + "</p>" +
            "<p>Culoare: " + masina.culoare + "</p>";
    } else {
        sectiune.innerHTML = "Nicio masina salvata";
    }
}

// ADAUGAT: stergere Masina Local Storage
function stergeMls() {
    localStorage.removeItem("masina");
    localStorage.removeItem("tip");
    localStorage.removeItem("model");
    localStorage.removeItem("culoare");
    afiseazaMls();
}

// ADAUGAT: stergere Masina Session Storage
function stergeMss() {
    sessionStorage.removeItem("masina");
    sessionStorage.removeItem("tip");
    sessionStorage.removeItem("model");
    sessionStorage.removeItem("culoare");
    afiseazaMss();
}

window.addEventListener("load", function() {
    afiseazaMls();
    afiseazaMss();
});
</script>
</head>
<body>
<div style="background-color:LimeGreen;color:white;font-size:200%" onclick="loadMjs()">

 <div id="mls"></div>

</body>
