<!DOCTYPE html>
<html>
<head>
<title>Modificari paragrafe</title>

<script>
function schimba() {
    document.getElementById("p1").innerHTML = "Acesta este paragraful 1";
    document.getElementById("p2").innerHTML = "Acesta este paragraful 2";
    document.getElementById("p3").innerHTML = "Acesta este paragraful 3";

    document.getElementById("p1").style.color = "red";
    document.getElementById("p1").style.backgroundColor = "yellow";

    document.getElementById("p2").style.color = "blue";
    document.getElementById("p2").style.backgroundColor = "pink";

    document.getElementById("p3").style.color = "green";
    document.getElementById("p3").style.backgroundColor = "orange";
}
</script>

</head>
<body>

<h1>Modificari paragrafe la click pe buton</h1>

<p id="p1">Acesta este un paragraf</p>

<p id="p2">Si acesta este un paragraf</p>

<p id="p3">Acesta este inca un paragraf</p>

<button type="button" onclick="schimba()">Apasa-ma!</button>

</body>
</html>
