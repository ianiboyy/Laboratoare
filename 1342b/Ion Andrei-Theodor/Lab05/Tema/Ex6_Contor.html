
<!DOCTYPE html>
<html>
<head>
<title>Contor bec</title>

<script>
var contor = 0;

function schimbaBec() {
    var bec = document.getElementById("bec");

    if (bec.src.includes("Bec%20stins.gif")) {
        bec.src = "Bec aprins.gif";
        contor = contor + 1;
    }
    else {
        bec.src = "Bec stins.gif";
    }

    document.getElementById("p1").innerHTML =
        "Becul a fost aprins de " + contor + " ori.";
}
</script>

</head>
<body>

<h1>Contor bec</h1>

<p>
<img id="bec" src="Bec stins.gif" width="100" height="180"
onclick="schimbaBec();">
</p>

<p id="p1">Becul a fost aprins de 0 ori.</p>

</body>
</html>
