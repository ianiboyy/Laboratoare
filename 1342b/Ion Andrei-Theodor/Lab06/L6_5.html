<!DOCTYPE html>
<html>
<head>
<title>Modificare folosind clase si evenimente</title>
</head>
<body>

<h3>Utilizati Javascript si HTML DOM</h3>

La click vor aparea Pisici
<hr>
<img class="animal" src="Pesti.jpg" width="160" height="120">
<br><br>

La mouseover vor aparea Munti
<hr>
<img class="peisaj" src="desert.jpg" width="160" height="120">
<br><br>

La click vor aparea Caini
<hr>
<img class="animal" src="egrete.jpg" width="160" height="120">
<br><br>

La mouseout va aparea o Mare
<hr>
<img class="peisaj" src="jungla.jpg" width="160" height="120">

<script>
var a = document.getElementsByClassName("animal");
var p = document.getElementsByClassName("peisaj");

a[0].onclick = function() {
    this.src = "Img/pisici.jpg";
};

a[1].onclick = function() {
    this.src = "Img/caini.jpg";
};

p[0].onmouseover = function() {
    this.src = "Img/munti.jpg";
};

p[1].onmouseout = function() {
    this.src = "Img/mare.jpg";
};
</script>

</body>
</html>
