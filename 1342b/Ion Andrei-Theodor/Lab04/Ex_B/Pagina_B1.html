
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CSS_B1</title>

<style>
    body {
        background-color: #ffffcc;
    }

    .center {
        text-align: center;
        color: white;
    }

    h1 {
        background-color: #00cc66;
        color: orange;
    }

    table {
        width: 100%;
        border-collapse: collapse;
    }

    #s1 table,
    #s1 th,
    #s1 td {
        border: 1px solid black;
    }

    #s2 table,
    #s2 th,
    #s2 td {
        border: 5px solid blue;
    }

    th, td {
        padding: 8px;
    }

    #s1 table {
        background-color: blue;
        color: white;
    }

    #s2 table {
        background-color: yellow;
        color: black;
    }

    #s2 {
        width: 50%;
    }
</style>
</head>

<body>

<h1 class="center">Tabele formatate</h1>

<div id="s1">
    <table>
        <tr>
            <th>Firstname</th>
            <th>Lastname</th>
            <th>Age</th>
        </tr>
        <tr>
            <td>Jill</td>
            <td>Smith</td>
            <td>50</td>
        </tr>
        <tr>
            <td>Eve</td>
            <td>Jackson</td>
            <td>94</td>
        </tr>
    </table>
    <br>
</div>

<div id="s2">
    <br>
    <table>
        <tr>
            <th>Firstname</th>
            <th>Lastname</th>
            <th>Age</th>
        </tr>
        <tr>
            <td>Jill</td>
            <td>Smith</td>
            <td>50</td>
        </tr>
        <tr>
            <td>Eve</td>
            <td>Jackson</td>
            <td>94</td>
        </tr>
    </table>
</div>

</body>
</html>
