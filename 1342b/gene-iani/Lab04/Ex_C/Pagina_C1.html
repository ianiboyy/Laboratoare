<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CSS_C1</title>
<style>

        #hd {
        font-variant: small-caps;
        color:magenta;
        background-color: rgb(178, 185, 72);
        font-size: large;
    }
     h1, caption {
        color: white;
    background-color: orange;
    font-size: xx-large;
    }
      body {
    background-color: #fff1cc;
    }
.center, p {
  text-align: center;
  color: red;
}

}

}
td{

}
</style>
