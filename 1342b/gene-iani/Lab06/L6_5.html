<!DOCTYPE html>
<html>
<head>
<title>
Modificare folosind clase si evenimente
</title>
</head>
<body>
<h3> Utilizati Javascript si HTML DOM pentru a inlocui imaginile de mai jos asa cum este indicat in textele de deasupra lor</h3>
La click vor aparea Pisici
<hr />
<img class="animal" src="Img/pisici.jpg" alt="Niste pisici" width="160" height="120">
<br /> <br />
La mouseover vor aparea Munti
<hr />
<img class="peisaj" src="Img/munti.jpg" alt="Niste munți" width="160" height="120">
<br /> <br />
La click vor aparea Caini
<hr />
<img class="animal" src="Img/caini.jpg" alt="Niste caini" width="160" height="120">
<br /> <br />
la mouseout va aparea o Mare
<hr />
<img class="peisaj" src="Img/mare.jpg" alt="O mare" width="160" height="120">

<script>
var animale = document.getElementsByClassName("animal");
var peisaje = document.getElementsByClassName("peisaj");

animale[0].src = "Img/mare.jpg";
animale[1].src = "Img/munti.jpg";
peisaje[0].src = "Img/caini.jpg";
peisaje[1].src = "Img/pisici.jpg";

animale[0].addEventListener("click", function () {
    animale[0].src = "Img/pisici.jpg";
});

peisaje[0].addEventListener("mouseover", function () {
    peisaje[0].src = "Img/munti.jpg";
});

animale[1].addEventListener("click", function () {
    animale[1].src = "Img/caini.jpg";
});

peisaje[1].addEventListener("mouseout", function () {
    peisaje[1].src = "Img/mare.jpg";
});
</script>

</body>
</html>
