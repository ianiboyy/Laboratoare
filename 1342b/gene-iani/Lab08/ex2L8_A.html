<!DOCTYPE html>
<html>
<head>
<title>Tabel masini</title>
<style>
table {
  font-family: arial, sans-serif;
  border-collapse: collapse;
  width: 100%;
}

td, th {
  border: 1px solid #dddddd;
  text-align: left;
  padding: 8px;
}
</style>
</head>
<body>
<h1> Masinile dorite </h1>

<form onsubmit="return adaugaMasina()">
  <input id="marca" placeholder="Marca" required>
  <input id="model" placeholder="Model" required>
  <input id="culoare" placeholder="Culoare" required>
  <input id="anFab" type="number" placeholder="An fabricatie" required>
  <button type="submit">Adauga masina</button>
</form>
<p id="mesaj"></p>
<table id="tm">
<tr>
    <th>Marca</th>
    <th>Model</th>
    <th>Culoare</th>
    <th>An fabricatie</th>
  </tr>
</table>

<script>
var m1 = new masina("Opel", "Zafira", "gri", 2015);
var m2 = new masina("Seat", "Ibiza", "roz", 2018);

document.getElementById("tm").innerHTML += m1.randNou(); 
document.getElementById("tm").innerHTML += m2.randNou(); 

if(localStorage.marca) {
var marca = localStorage.marca;
var model = localStorage.model;
var culoare = localStorage.culoare;
var anFab = localStorage.anFab;

var mNoua = new masina(marca, model, culoare, anFab);

document.getElementById("tm").innerHTML += mNoua.randNou();
}

function masina(mk, md, cl, an){
this.marca = mk;
this.model = md;
this.culoare = cl;
this.anFab = an;
this.randNou = function() {return "<tr><td>" + this.marca +"</td><td>" + this.model + "</td><td>" + this.culoare + "</td><td>" + this.anFab + "</td></tr>"};
}

function valideaza(marca, model, culoare, an) {
if (marca.trim() === "" || model.trim() === "" || culoare.trim() === "") {
return "Marca, modelul si culoarea nu pot fi goale!";
}
var anNum = Number(an);
var anCurent = new Date().getFullYear();
if (an.trim() === "" || !Number.isInteger(anNum) || anNum < 1900 || anNum > anCurent) {
return "Anul trebuie sa fie un numar intreg intre 1900 si " + anCurent + "!";
}
return "";
}

function citesteFormular(){
    var marca = document.getElementById("marca").value.trim();
    var model = document.getElementById("model").value.trim();
    var culoare = document.getElementById("culoare").value.trim();
    var an = document.getElementById("anFab").value.trim();
    var eroare = valideaza(marca, model, culoare, an);
    deocument.getElementById("mesaj").innerHTML = eroare;
    if (eroare !== "") {return null;}
    return new masina(marca, model, culoare, an);
}
function adaugaMasina() {
var masinaNoua = citesteFormular();
if (masinaNoua !== null) {
document.getElementById("mesaj").innerHTML = masinaNoua.randNou();
localStorage.setItem("marca", masinaNoua.marca);
localStorage.setItem("model", masinaNoua.model);
localStorage.setItem("culoare", masinaNoua.culoare);
localStorage.setItem("anFab", masinaNoua.anFab);
return false;
}


return false;
}
</script>
</body>
</html>
