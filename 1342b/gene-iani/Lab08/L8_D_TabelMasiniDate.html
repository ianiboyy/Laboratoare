<!DOCTYPE html>
<html>
<head>
<title>Tabel masini - doar date</title>
<style>
table {
  font-family: arial, sans-serif;
  border-collapse: collapse;
  width: 100%;
}

td, th {
  border: 1px solid #dddddd;
  text-align: left;
  padding: 8px;
}
</style>
</head>
<body>
<h1>Masinile dorite</h1>

<form onsubmit="return adaugaMasina()">
  <input id="marca" placeholder="Marca" required>
  <input id="model" placeholder="Model" required>
  <input id="culoare" placeholder="Culoare" required>
  <input id="anFab" type="number" placeholder="An fabricatie" required>
  <button type="submit">Adauga masina</button>
  <button type="button" onclick="stergeToate()">Sterge toate</button>
</form>
<p id="mesaj"></p>

<table id="tm">
<tr>
  <th>Marca</th>
  <th>Model</th>
  <th>Culoare</th>
  <th>An fabricatie</th>
</tr>
</table>

<script>
const masini2Store = [];

function masina(mk, md, cl, an) {
  this.marca = mk;
  this.model = md;
  this.culoare = cl;
  this.anFab = an;
}

masina.prototype.randNou = function() {
  return "<tr><td>" + this.marca + "</td><td>" + this.model + "</td><td>" + this.culoare + "</td><td>" + this.anFab + "</td></tr>";
};

if (localStorage.carsArray) {
  var arrayJSON = localStorage.carsArray;
  var masiniStored = JSON.parse(arrayJSON);

  for (var i = 0; i < masiniStored.length; i++) {
    var mRestaurata = new masina(
      masiniStored[i].marca,
      masiniStored[i].model,
      masiniStored[i].culoare,
      masiniStored[i].anFab
    );

    masini2Store.push(mRestaurata);
    document.getElementById("tm").innerHTML += mRestaurata.randNou();
  }
}

function valideaza(marca, model, culoare, an) {
  if (marca.trim() === "" || model.trim() === "" || culoare.trim() === "") {
    return "Marca, modelul si culoarea nu pot fi goale!";
  }

  var anNum = Number(an);
  var anCurent = new Date().getFullYear();
  if (an.trim() === "" || !Number.isInteger(anNum) || anNum < 1900 || anNum > anCurent) {
    return "Anul trebuie sa fie un numar intreg intre 1900 si " + anCurent + "!";
  }

  return "";
}

function adaugaMasina() {
  var marca = document.getElementById("marca").value;
  var model = document.getElementById("model").value;
  var culoare = document.getElementById("culoare").value;
  var an = document.getElementById("anFab").value;

  var eroare = valideaza(marca, model, culoare, an);
  if (eroare !== "") {
    document.getElementById("mesaj").innerHTML = eroare;
    return false;
  }

  document.getElementById("mesaj").innerHTML = "";

  var mNoua = new masina(
    marca.trim(),
    model.trim(),
    culoare.trim(),
    Number(an)
  );

  document.getElementById("tm").innerHTML += mNoua.randNou();
  masini2Store.push(mNoua);

  var myJSON = JSON.stringify(masini2Store);
  localStorage.setItem("carsArray", myJSON);

  document.getElementById("marca").value = "";
  document.getElementById("model").value = "";
  document.getElementById("culoare").value = "";
  document.getElementById("anFab").value = "";

  return false;
}

function stergeToate() {
  document.getElementById("tm").innerHTML =
    "<tr><th>Marca</th><th>Model</th><th>Culoare</th><th>An fabricatie</th></tr>";
  masini2Store.length = 0;
  localStorage.removeItem("carsArray");
  document.getElementById("mesaj").innerHTML = "";
}
</script>

<!--
În L8_D, localStorage păstrează doar proprietățile marca, model, culoare și anFab,
sub cheia carsArray. Metoda randNou este definită pe masina.prototype, deci
JSON.stringify nu stochează textul rândului.
La încărcare, datele JSON sunt citite și fiecare mașină este recreată cu new masina,
astfel încât să primească din nou metoda randNou(). Așa, rândul se generează mereu
după forma curentă a paginii.
Față de L8_C, schimbarea formei tabelului nu afectează datele vechi stocate: în
L8_C rândurile vechi sunt text HTML deja fixat, în timp ce în L8_D se regenerează.
-->
</body>
</html>
