<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Exercițiul 6 – contor bec</title>
    <script>
        let becAprins = false;
        let numarAprinderi = 0;

        function comutaBec() {
            becAprins = !becAprins;
            const bec = document.getElementById("bec");

            if (becAprins) {
                numarAprinderi++;
                bec.src = "Bec aprins.gif";
            } else {
                bec.src = "Bec stins.gif";
            }

            document.getElementById("contor").textContent =
                "Becul a fost aprins de " + numarAprinderi + " ori.";
        }
    </script>
</head>
<body>
    <h1>Contor pentru bec</h1>
    <img id="bec" src="Bec stins.gif" width="100" height="180"
         alt="Bec stins" onclick="comutaBec()">
    <p id="contor">Becul a fost aprins de 0 ori.</p>
</body>
</html>
