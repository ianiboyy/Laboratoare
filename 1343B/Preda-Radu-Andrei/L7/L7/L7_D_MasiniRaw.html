	<!DOCTYPE html>
	<html lang="ro">
	<head>
		<meta charset="UTF-8">
		<title>Masini - abordare "bruta"</title>
		<script>
	// "masina" JS
	function loadMjs(){
	document.getElementById("mjs").innerHTML = 
	"<ul>"+
	"<li>Tip:  Dacia</li>" +
	"<li>Model:  Logan</li>" +
	"<li>Culoare:  verde</li>" +
	"</ul>";
	}

	function afiseazaMls(){
		if(localStorage.getItem("tip") && localStorage.getItem("model") && localStorage.getItem("culoare")){
			document.getElementById("mls").innerHTML = 
			"<ul>"+
			"<li>Tip: " + localStorage.getItem("tip") + "</li>" +
			"<li>Model: " + localStorage.getItem("model") + "</li>" +
			"<li>Culoare: " + localStorage.getItem("culoare") + "</li>" +
			"</ul>";
		}
		else
		{
			document.getElementById('mls').innerHTML = "<p>nicio masina</p>";
		}
		

	}

	function salveazaMls(){
		localStorage.tip = document.getElementById("tipL").value;
		localStorage.model = document.getElementById("modelL").value;
		localStorage.culoare = document.getElementById("culoareL").value;

		afiseazaMls();
        return false;
	}

	function stergeMls(){
		localStorage.removeItem("tip")
		localStorage.removeItem("model")
		localStorage.removeItem("culoare")

		document.getElementById("tipL").value = "";
        document.getElementById("modelL").value = "";
        document.getElementById("culoareL").value = "";
	}

	function afiseazaMss(){
		if(localStorage.getItem("tip") && localStorage.getItem("model") && localStorage.getItem("culoare")){
			document.getElementById("mss").innerHTML = 
			"<ul>"+
			"<li>Tip: " + localStorage.getItem("tip") + "</li>" +
			"<li>Model: " + localStorage.getItem("model") + "</li>" +
			"<li>Culoare: " + localStorage.getItem("culoare") + "</li>" +
			"</ul>";
		}
		else
		{
			document.getElementById('mss').innerHTML = "<p>nicio masina</p>";
		}
		

	}

	function salveazaMss(){
		localStorage.tip = document.getElementById("tipS").value;
		localStorage.model = document.getElementById("modelS").value;
		localStorage.culoare = document.getElementById("culoareS").value;

		afiseazaMss();
        return false;
	}

	function stergeMss(){
		localStorage.removeItem("tip")
		localStorage.removeItem("model")
		localStorage.removeItem("culoare")

		document.getElementById("tipS").value = "";
        document.getElementById("modelS").value = "";
        document.getElementById("culoareS").value = "";
	}

	// "masina" LS
	function loadMls(){
		if(localStorage.tip){
			var tL = localStorage.tip;}
		else{
			var tL = prompt("Tip");
			localStorage.tip = tL;
		}
		if(localStorage.model){
			var mL = localStorage.model;
		
			}
		else{
			var mL = prompt("Model");
			localStorage.model = mL;
		}
		if(localStorage.culoare){
			var cL = localStorage.culoare;}
		else{
			var cL = prompt("Culoare:");
			localStorage.culoare = cL;
		}
	document.getElementById("mls").innerHTML = 
	"<ul>"+
	"<li>Tip: " + tL +"</li>" +
	"<li>Model: "  + mL +"</li>" +
	"<li>Culoare: "  + cL + "</li>" +
	"</ul>";
	}

	// "masina" SS
	function loadMss(){
	if(sessionStorage.tip){
	var tS = sessionStorage.tip;}
	else{
	var tS = prompt("Tip");
	sessionStorage.tip = tS;
	}
	if(sessionStorage.model){
	var mS = sessionStorage.model;}
	else{
	var mS = prompt("Model");
	sessionStorage.model = mS;
	}
	if(sessionStorage.culoare){
	var cS = sessionStorage.culoare;}
	else{
	var cS = prompt("Culoare:");
	sessionStorage.culoare = cS;
	}
	document.getElementById("mss").innerHTML = 
	"<ul>"+
	"<li>Tip: " + tS +"</li>" +
	"<li>Model: "  + mS +"</li>" +
	"<li>Culoare: "  + cS + "</li>" +
	"</ul>";
	}
	</script>
	</head>
	<body>
	<div style="background-color:LimeGreen;color:white;font-size:200%">
	<p>Masina JavaScript</p>
		<div id="mjs"></div>
		</div>

	 <div style="background-color:ForestGreen;color:white;font-size:200%">
 		<p>Masina Local Storage</p>
 		<form onsubmit="return salveazaMls()">
 		<label for="tipL">Tip</label> <input id="tipL" required>
 		<label for="modelL">Model</label> <input id="modelL" required>
 		<label for="culoareL">Culoare</label> <input id="culoareL" required>
 		<button type="submit">Salvează</button>
		<button type="button" onclick ="stergeMls()">Sterge</button>
 		</form>
 		<div id="mls"></div> <!-- secțiunea cu „răspunsul” --></div>


		
	<div style="background-color:SeaGreen;color:white;font-size:200%">
		<p>Masina Session Storage</p>
		<form onsubmit="return salveazaMss()">
 		<label for="tipS">Tip</label> <input id="tipS" required>
 		<label for="modelS">Model</label> <input id="modelS" required>
 		<label for="culoareS">Culoare</label> <input id="culoareS" required>
 		<button type="submit">Salvează</button>
		<button type="button" onclick ="stergeMss()">Sterge</button>
 		</form>
 		<div id="mss"></div> <!-- secțiunea cu „răspunsul” --></div>

	</body>
	</html>
