<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Masini - abordare cu folosirea de obiecte</title>
    <script>
       
        function loadMjs() {
            var mJS = {tip : "Dacia", model : "Logan", culoare : "verde", anFab : 2012};
            document.getElementById("mjs").innerHTML = 
                "<ul>"+
                "<li>Tip: " + mJS.tip +"</li>" +
                "<li>Model: "  + mJS.model +"</li>" +
                "<li>Culoare: "  + mJS.culoare + "</li>" +
                "<li>An fabricatie: "  + mJS.anFab + "</li>" +
                "</ul>";
        }

        
        function afiseaza(storage, idElement) {
            if (storage.getItem("masina")) {
                var masinaObj = JSON.parse(storage.getItem("masina"));
                document.getElementById(idElement).innerHTML = 
                    "<ul>" +
                    "<li>Tip: " + masinaObj.tip + "</li>" +
                    "<li>Model: " + masinaObj.model + "</li>" +
                    "<li>Culoare: " + masinaObj.culoare + "</li>" +
                    "<li>An: " + masinaObj.an + "</li>" +
                    "</ul>";
            } else {
                document.getElementById(idElement).innerHTML = "<p>Nicio masina salvata</p>";
            }
        }

        function sterge(storage, idElement, idSufix) {
            storage.removeItem("masina");
            
            document.getElementById("tip" + idSufix).value = "";
            document.getElementById("model" + idSufix).value = "";
            document.getElementById("culoare" + idSufix).value = "";
            document.getElementById("an" + idSufix).value = "";
            
            afiseaza(storage, idElement);
        }

   
        function loadMls() {
            afiseaza(localStorage, "mls");
        }

        function salveazaMls() {
            var tL = document.getElementById("tipL").value;
            var mL = document.getElementById("modelL").value;
            var cL = document.getElementById("culoareL").value;
            var aL = document.getElementById("anL").value; 
            
            var masinaL = { tip: tL, model: mL, culoare: cL, an: aL };
            localStorage.setItem("masina", JSON.stringify(masinaL));
            
            loadMls(); 
            return false;
        }

        function stergeMls() {
            sterge(localStorage, "mls", "L");
        }

      
        function loadMss() {
            afiseaza(sessionStorage, "mss");
        }

        function salveazaMss() {
            var tS = document.getElementById("tipS").value;
            var mS = document.getElementById("modelS").value;
            var cS = document.getElementById("culoareS").value;
            var aS = document.getElementById("anS").value; 
            
            var masinaS = { tip: tS, model: mS, culoare: cS, an: aS };
            sessionStorage.setItem("masina", JSON.stringify(masinaS));
            
            loadMss(); 
            return false;
        }

        function stergeMss() {
            sterge(sessionStorage, "mss", "S");
        }
    </script>
</head>
<body onload="loadMls(); loadMss();">

    <div style="background-color:rgb(50, 130, 205);color:white;font-size:200%" onclick="loadMjs()">
        <p>Masina JavaScript</p>
        <div id="mjs"></div>
    </div>

    <div style="background-color:rgb(139, 34, 134);color:white;font-size:200%">
        <p>Masina Local Storage</p>
        <form onsubmit="return salveazaMls()">
            <label for="tipL">Tip</label> <input id="tipL" required>
            <label for="modelL">Model</label> <input id="modelL" required>
            <label for="culoareL">Culoare</label> <input id="culoareL" required>
            <label for="anL">An fabricatie</label> <input type="number" id="anL" required>
            <button type="submit">Salveaza</button>
            <button type="button" onclick="stergeMls()">Sterge</button>
        </form>
        <div id="mls"></div>
    </div>

    <div style="background-color:rgb(55, 46, 139);color:white;font-size:200%">
        <p>Masina Session Storage</p>
        <form onsubmit="return salveazaMss()">
            <label for="tipS">Tip</label> <input id="tipS" required>
            <label for="modelS">Model</label> <input id="modelS" required>
            <label for="culoareS">Culoare</label> <input id="culoareS" required>
            <label for="anS">An fabricatie</label> <input type="number" id="anS" required>
            <button type="submit">Salveaza</button>
            <button type="button" onclick="stergeMss()">Sterge</button>
        </form>
        <div id="mss"></div>
    </div>

</body>
</html>
