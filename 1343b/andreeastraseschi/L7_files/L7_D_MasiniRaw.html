<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Masini - abordare "bruta"</title>
    <script>
        function loadMjs(){
            document.getElementById("mjs").innerHTML = 
            "<ul>"+
            "<li>Tip: Dacia</li>" +
            "<li>Model: Logan</li>" +
            "<li>Culoare: verde</li>" +
            "</ul>";
        }

        function afiseazaMls() {
            if(localStorage.getItem("tipL")) {
                document.getElementById("mls").innerHTML = 
                "<ul>"+
                "<li>Tip: " + localStorage.tipL +"</li>" +
                "<li>Model: " + localStorage.modelL +"</li>" +
                "<li>Culoare: " + localStorage.culoareL + "</li>" +
                "</ul>";
            } else {
                document.getElementById("mls").innerHTML = "<p>Nicio masina salvata</p>";
            }
        }

        function salveazaMls() {
            localStorage.tipL = document.getElementById("tipL").value;
            localStorage.modelL = document.getElementById("modelL").value;
            localStorage.culoareL = document.getElementById("culoarel").value;
            afiseazaMls();
            return false;
        }

        function stergeMls() {
            localStorage.removeItem("tipL");
            localStorage.removeItem("modelL");
            localStorage.removeItem("culoarel");
            afiseazaMls();
        }

        function afiseazaMss() {
            if(sessionStorage.getItem("tipS")) {
                document.getElementById("mss").innerHTML = 
                "<ul>"+
                "<li>Tip: " + sessionStorage.getItem("tipS") +"</li>" +
                "<li>Model: " + sessionStorage.getItem("modelS") +"</li>" +
                "<li>Culoare: " + sessionStorage.getItem("culoares") + "</li>" +
                "</ul>";
            } else {
                document.getElementById("mss").innerHTML = "<p>Nicio masina salvata</p>";
            }
        }

        function salveazaMss() {
            sessionStorage.setItem("tipS", document.getElementById("tipS").value);
            sessionStorage.setItem("modelS", document.getElementById("modelS").value);
            sessionStorage.setItem("culoares", document.getElementById("culoares").value);
            afiseazaMss();
            return false;
        }

        function stergeMss() {
            sessionStorage.removeItem("tipS");
            sessionStorage.removeItem("modelS");
            sessionStorage.removeItem("culoares");
            afiseazaMss();
        }

        function init() {
            loadMjs();
            afiseazaMls();
            afiseazaMss();
        }
    </script>
</head>
<body onload="init()">

<div style="background-color:LimeGreen;color:white;font-size:150%">
    <p>Masina JavaScript</p>
    <div id="mjs"></div>
</div>

<div style="background-color:ForestGreen;color:white;font-size:150%">
    <p>Masina Local Storage</p>
    <form onsubmit="return salveazaMls()">
        <label for="tipL">Tip</label> <input id="tipL" required><br>
        <label for="modelL">Model</label> <input id="modelL" required><br>
        <label for="culoarel">Culoare</label> <input id="culoarel" required><br>
        <button type="submit">Salvează</button>
        <button type="button" onclick="stergeMls()">Șterge</button>
    </form>
    <div id="mls"></div>
</div>

<div style="background-color:SeaGreen;color:white;font-size:150%">
    <p>Masina Session Storage</p>
    <form onsubmit="return salveazaMss()">
        <label for="tipS">Tip</label> <input id="tipS" required><br>
        <label for="modelS">Model</label> <input id="modelS" required><br>
        <label for="culoares">Culoare</label> <input id="culoares" required><br>
        <button type="submit">Salvează</button>
        <button type="button" onclick="stergeMss()">Șterge</button>
    </form>
    <div id="mss"></div>
</div>

</body>
</html>
