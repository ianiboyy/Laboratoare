<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Masini - abordare cu folosirea de obiecte</title>
    <script>
        function loadMjs(){
            var mJS = {tip : "Dacia", model : "Logan", culoare : "verde", anFab : 2012};
            document.getElementById("mjs").innerHTML = 
            "<ul>"+
            "<li>Tip: " + mJS.tip +"</li>" +
            "<li>Model: " + mJS.model +"</li>" +
            "<li>Culoare: " + mJS.culoare + "</li>" +
            "<li>An fabricatie: " + mJS.anFab + "</li>" +
            "</ul>";
        }

        function afiseaza(storage, elementId, cheie) {
            if(storage.getItem(cheie)){
                var masinaObj = JSON.parse(storage.getItem(cheie));
                document.getElementById(elementId).innerHTML = 
                "<ul>"+
                "<li>Tip: " + masinaObj.tip +"</li>" +
                "<li>Model: " + masinaObj.model +"</li>" +
                "<li>Culoare: " + masinaObj.culoare + "</li>" +
                "<li>An fabricatie: " + masinaObj.anFab + "</li>" +
                "</ul>";
            } else {
                document.getElementById(elementId).innerHTML = "<p>Nicio masina salvata</p>";
            }
        }

        function salveazaMls() {
            var masinaL = {
                tip: document.getElementById("tipL").value,
                model: document.getElementById("modelL").value,
                culoare: document.getElementById("culoareL").value,
                anFab: Number(document.getElementById("anL").value)
            };
            localStorage.setItem("masinaL", JSON.stringify(masinaL));
            afiseaza(localStorage, "mls", "masinaL");
            return false;
        }

        function stergeMls() {
            localStorage.removeItem("masinaL");
            afiseaza(localStorage, "mls", "masinaL");
        }

        function salveazaMss() {
            var masinaS = {
                tip: document.getElementById("tipS").value,
                model: document.getElementById("modelS").value,
                culoare: document.getElementById("culoareS").value,
                anFab: Number(document.getElementById("anS").value)
            };
            sessionStorage.setItem("masinaS", JSON.stringify(masinaS));
            afiseaza(sessionStorage, "mss", "masinaS");
            return false;
        }

        function stergeMss() {
            sessionStorage.removeItem("masinaS");
            afiseaza(sessionStorage, "mss", "masinaS");
        }

        function init() {
            loadMjs();
            afiseaza(localStorage, "mls", "masinaL");
            afiseaza(sessionStorage, "mss", "masinaS");
        }
    </script>
</head>
<body onload="init()">

<div style="background-color:LimeGreen;color:white;font-size:150%">
    <p>Masina JavaScript</p>
    <div id="mjs"></div>
</div>

<div style="background-color:ForestGreen;color:white;font-size:150%">
    <p>Masina Local Storage</p>
    <form onsubmit="return salveazaMls()">
        <label for="tipL">Tip</label> <input id="tipL" required><br>
        <label for="modelL">Model</label> <input id="modelL" required><br>
        <label for="culoareL">Culoare</label> <input id="culoareL" required><br>
        <label for="anL">An fabricatie</label> <input type="number" id="anL" min="1950" max="2026" value="2026" required><br>
        <button type="submit">Salvează</button>
        <button type="button" onclick="stergeMls()">Șterge</button>
    </form>
    <div id="mls"></div>
</div>

<div style="background-color:SeaGreen;color:white;font-size:150%">
    <p>Masina Session Storage</p>
    <form onsubmit="return salveazaMss()">
        <label for="tipS">Tip</label> <input id="tipS" required><br>
        <label for="modelS">Model</label> <input id="modelS" required><br>
        <label for="culoareS">Culoare</label> <input id="culoareS" required><br>
        <label for="anS">An fabricatie</label> <input type="number" id="anS" min="1950" max="2026" value="2026" required><br>
        <button type="submit">Salvează</button>
        <button type="button" onclick="stergeMss()">Sterge</button>
    </form>
    <div id="mss"></div>
</div>

</body>
</html>
